name: projection-tests

on:
  push:
    branches:
      - main
      - plan/sysml-render-architecture
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run projection tests
        run: python -m unittest discover -s tests -v
