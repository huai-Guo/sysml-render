services:
  database:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: test_username
      POSTGRES_PASSWORD: test_password
    volumes:
      - syson_pgdata:/var/lib/postgresql/data

  app:
    image: "${IMAGE_TAG:-eclipsesyson/syson:v2026.9.0}"
    ports:
      - "8080:8080"
      - "3000:3000"
    environment:
      SIRIUS_COMPONENTS_DIAGRAM_DEBUG: "true"
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/postgres
      SPRING_DATASOURCE_USERNAME: test_username
      SPRING_DATASOURCE_PASSWORD: test_password
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: "*"
      SIRIUS_WEB_TREE_NEW-PALETTE_ENABLED: "true"
      SERVER_PORT: "8080"
    depends_on:
      - database

  diagram-image-server:
    profiles: ["render"]
    build:
      context: https://github.com/eclipse-sirius/sirius-web.git#v2026.9.0:diagram-image-server
    command: "-- -s http://localhost:8080 -p 3000"
    network_mode: service:app
    depends_on:
      - app

volumes:
  syson_pgdata:
